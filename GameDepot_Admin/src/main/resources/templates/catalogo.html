<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - GameDepot Admin</title>
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
    <div class="page">
        <div th:replace="~{fragments :: header(activeMenu='productos')}"></div>
        <div class="main-layout">
            <div th:replace="~{fragments :: sidebar(activeMenu='productos')}"></div>
            <main class="content">
                <div class="sec-head">
                    <h2>Catalogo de Juegos</h2>
                    <a th:href="@{/catalogo/nuevo}" class="btn-primary">Nuevo Producto</a>
                </div>
                <div class="panel">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Título</th>
                            <th class="hide-m">Plataforma</th>
                            <th>Precio</th>
                            <th class="hide-m">Stock</th>
                            <th>Activo</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="videojuego : ${videojuegos}">
                            <td th:text="${videojuego.nombre}">Título</td>
                            <td class="hide-m" th:text="${videojuego.plataforma.nombre}">Steam</td>
                            <td th:text="|$${#numbers.formatDecimal(videojuego.precio, 1, 2)}|">$59.99</td>
                            <td class="hide-m" th:text="${videojuego.stock}">3</td>

                            <td>
                                <span class="status"
                                      th:classappend="${videojuego.activo != null ? 'warn' : ''}"
                                      th:text="${videojuego.activo}">
                                        Entregado
                                </span>
                            </td>

                            <td>
                                <a class="link-s"
                                   th:href="@{/catalogo/editar/{id}(id=${videojuego.id})}">
                                    Editar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(videojuegos)}">
                            <td colspan="5">No hay videojuegos registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
