<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar usuario - GameDepot Admin</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
    <div class="page">
        <div th:replace="~{fragments :: header(activeMenu='usuarios')}"></div>
        <div class="main-layout">
            <div th:replace="~{fragments :: sidebar(activeMenu='usuarios')}"></div>
            <main class="content">
                <div class="sec-head">
                    <h2>Gestionar usuario</h2>
                    <a class="btn-ghost" th:href="@{/usuarios}">Volver a usuarios</a>
                </div>

                <section class="panel" aria-labelledby="datos-usuario">
                    <div class="sec-head">
                        <h3 id="datos-usuario">Datos del usuario</h3>
                        <span class="status" th:classappend="${usuario.activo ? '' : 'warn'}"
                            th:text="${usuario.activo ? 'Cuenta activa' : 'Cuenta desactivada'}">Cuenta activa</span>
                    </div>
                    <dl class="fgrid">
                        <div class="field">
                            <dt class="eyebrow">ID</dt>
                            <dd class="input" th:text="${usuario.id}">1</dd>
                        </div>
                        <div class="field">
                            <dt class="eyebrow">Nombre</dt>
                            <dd class="input" th:text="${usuario.nombre}">Nombre del usuario</dd>
                        </div>
                        <div class="field">
                            <dt class="eyebrow">Correo electrónico</dt>
                            <dd class="input" style="overflow-wrap: anywhere" th:text="${usuario.email}">Correo del
                                usuario</dd>
                        </div>
                        <div class="field">
                            <dt class="eyebrow">Fecha de registro</dt>
                            <dd class="input" th:text="${usuario.fechaRegistro}">Fecha de registro</dd>
                        </div>

                        <div class="field">
                            <dt class="eyebrow">Rol actual</dt>
                            <dd class="input" th:text="${usuario.rol}">Rol actual</dd>
                        </div>

                        <div class="field">
                            <dt class="eyebrow">País</dt>
                            <dd class="input" th:text="${usuario.pais}">País</dd>
                        </div>
                    </dl>
                </section>

                <section class="panel" aria-labelledby="estado-cuenta">
                    <div class="sec-head">
                        <h3 id="estado-cuenta">ACTUALIZAR ROL Y ESTADO</h3>
                    </div>
                    <form id="usuario-form" th:action="@{/api/usuario/{id}(id=${usuario.id})}"
                          th:object="${usuario}" th:attr="data-usuarios-url=@{/usuarios}" method="post" class="fgrid">
                        <p id="usuario-mensaje" role="status" style="grid-column: 1 / -1"></p>

                        <div class="field">
                            <label for="rol">ROL</label>
                            <select class="input" id="rol" th:field="*{rol}" required>
                                <option value="" disabled>Selecciona un rol</option>
                                <option value="ADMIN">Admin</option>
                                <option value="CLIENTE">Cliente</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="activo">ESTADO DEL USUARIO</label>
                            <select id="activo" th:field="*{activo}" class="input" required>
                                <option value="" disabled>Selecciona un estado</option>
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>

                        <div class="form-actions" style="grid-column: 1 / -1">
                            <button type="submit" class="btn-primary">GUARDAR CAMBIOS</button>
                            <a th:href="@{/usuarios}" class="btn-ghost">CANCELAR</a>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('usuario-form');
        const mensaje = document.getElementById('usuario-mensaje');
        const boton = formulario.querySelector('button[type="submit"]');
        const originales = new FormData(formulario);

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensaje.textContent = '';

            const campos = new FormData(formulario);
            const valores = {
                rol: campos.get('rol'),
                activo: campos.get('activo') === 'true'
            };

            const cambios = Object.fromEntries(
                Object.entries(valores).filter(([campo]) =>
                    campos.get(campo) !== originales.get(campo)
                )
            );

            if (Object.keys(cambios).length === 0) {
                mensaje.textContent = 'No hay cambios para guardar.';
                return;
            }

            boton.disabled = true;

            try {
                const cabeceraCsrf = document.querySelector('meta[name="_csrf_header"]').content;
                const tokenCsrf = document.querySelector('meta[name="_csrf"]').content;

                const respuesta = await fetch(formulario.action, {
                    method: 'PATCH',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        [cabeceraCsrf]: tokenCsrf
                    },
                    body: JSON.stringify(cambios)
                });

                if (respuesta.redirected || respuesta.status === 401) {
                    mensaje.textContent = 'Vuelve a iniciar sesión para guardar los cambios.';
                    return;
                }

                if (!respuesta.ok) {
                    const error = await respuesta.json().catch(() => null);
                    mensaje.textContent = error?.message
                        || `No se pudieron guardar los cambios (${respuesta.status}).`;
                    return;
                }

                window.location.assign(formulario.dataset.usuariosUrl);
            } catch (error) {
                console.error(error);
                mensaje.textContent = 'Ocurrió un error al enviar los cambios.';
            } finally {
                boton.disabled = false;
            }
        });
    </script>
</body>

</html>
