<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - GameDepot Admin</title>
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
    <div class="page">
        <div th:replace="~{fragments :: header(activeMenu='usuarios')}"></div>
        <div class="main-layout">
            <div th:replace="~{fragments :: sidebar(activeMenu='usuarios')}"></div>
            <main class="content">
                <div class="sec-head">
                    <h2>Directorio de Usuarios</h2>
                </div>
                <div class="panel">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th class="hide-m">Correo</th>
                                <th>ROL</th>
                                <th>Activo</th>
                                <th>Gestion</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.nombre}">nombre</td>
                                <td class="hide-m" th:text="${usuario.email}">correo@correo.com</td>
                                <td th:text="${usuario.rol}">ADMIN</td>

                                <td>
                                    <span class="status" th:classappend="${usuario.activo != null ? 'warn' : ''}"
                                        th:text="${usuario.activo}">
                                        Activo
                                    </span>
                                </td>

                                <td>
                                    <a class="link-s" th:href="@{/catalogo/editar}">
                                        Gestionar
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="5">No hay usuarios para mostrar.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
