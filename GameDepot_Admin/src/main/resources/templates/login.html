<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDepot Admin — Iniciar Sesión</title>
  <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body class="page">
  <main class="content" style="margin: auto; max-width: 880px">
    <div class="fgrid">
      <section class="panel" aria-labelledby="login-title">
        <div class="sec-head">
          <label class="brand">GameDepot</label>
        </div>

        <h1 id="login-title">Bienvenido de vuelta</h1>
        <p>Accede a tus licencias, pedidos y favoritos.</p>

        <form id="login-form" th:action="@{/login}" method="post" class="fgrid" style="margin-top: 16px">
          <p th:if="${param.error != null}" role="alert" style="grid-column: 1 / -1">
            No se pudo iniciar sesión. Verifica tus credenciales.
          </p>

          <div class="field" style="grid-column: 1 / -1">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="email" class="input" placeholder="nombre@ejemplo.com"
              autocomplete="username" required>
          </div>

          <div class="field" style="grid-column: 1 / -1">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" class="input" placeholder="Tu contraseña"
              autocomplete="current-password" required>
          </div>

          <div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px">
            <label for="remember">
              <input type="checkbox" id="remember" checked>
              Mantener sesión iniciada
            </label>
            <a href="#" class="link-s">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="form-actions" style="grid-column: 1 / -1">
            <button type="submit" class="btn-primary" style="width: 100%">Entrar a mi cuenta</button>
          </div>
        </form>

        <div style="display: grid; gap: 12px; margin-top: 16px">
          <p>¿No tienes cuenta? <a href="registro.html" class="link-s">Crea una aquí</a></p>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
