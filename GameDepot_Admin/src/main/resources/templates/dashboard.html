<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GameDepot Admin</title>
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
    <div class="page">
        <div th:replace="~{fragments :: header(activeMenu='dashboard')}"></div>
        <div class="main-layout">
            <div th:replace="~{fragments :: sidebar(activeMenu='dashboard')}"></div>

            <main class="content">

                <div class="sec-head">
                    <h2>Estadisticas</h2>
                </div>

                <!-- Estadisticas Responsivas -->
                <div class="stats">
                    <div class="stat"><span class="eyebrow">Ingresos Mes</span><b
                            th:text="${stats.ingresos}">$42,850</b></div>
                    <div class="stat"><span class="eyebrow">Ventas Totales</span><b th:text="${stats.ventas}">1,204</b>
                    </div>
                    <div class="stat"><span class="eyebrow">Nuevos Usuarios</span><b th:text="${stats.usuarios}">342</b>
                    </div>
                    <div class="stat hide-m"><span class="eyebrow">Licencias Activas </span><b
                            th:text="${stats.licencias}"> 8,901</b></div>
                </div>

                <div class="panel">
                    <h3 style="margin-bottom:16px">Ultimos Pedidos Completados</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th class="hide-m">Folio</th> <!-- Oculto en movil -->
                                <th>Comprador</th>
                                <th class="hide-t">Fecha</th> <!-- Oculto en movil y tablet -->
                                <th>Monto</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pedido : ${pedidosRecientes}">
                                <td class="mono hide-m" th:text="${pedido.folio}">REF-9021</td>

                                <td th:text="${compradoresPorId[pedido.usuarioId] ?: ('Usuario #' + pedido.usuarioId)}">
                                    Nombre del comprador
                                </td>

                                <td class="hide-t" th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">
                                    14/11/2026 14:30
                                </td>

                                <td th:text="|$${#numbers.formatDecimal(pedido.total, 1, 2)}|">$59.99</td>

                                <td>
                                    <span class="status"
                                        th:classappend="${pedido.estado != null and pedido.estado == 'PENDIENTE' ? 'warn' : ''}"
                                        th:text="${pedido.estado}">
                                        Entregado
                                    </span>
                                </td>

                                <td>
                                    <a class="link-s" th:href="@{/pedidos/gestionar/{id}(id=${pedido.id})}">
                                        Gestionar
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(pedidosRecientes)}">
                                <td colspan="6">No hay pedidos registrados este mes.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
