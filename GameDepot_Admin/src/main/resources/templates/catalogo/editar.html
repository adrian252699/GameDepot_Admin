<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - GameDepot Admin</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
    <div class="page">
        <div th:replace="~{fragments :: header('productos')}"></div>
        <div class="main-layout">
            <div th:replace="~{fragments :: sidebar('productos')}"></div>

            <main class="content">
                <div class="sec-head">
                    <h2>Editar Producto</h2>
                    <a th:href="@{/catalogo}" class="btn-ghost">Volver al catálogo</a>
                </div>
                <div class="panel">
                    <form id="videojuego-form" th:action="@{/api/videojuego/{id}(id=${videojuego.id})}"
                        th:object="${videojuego}" th:attr="data-catalogo-url=@{/catalogo}" method="post" class="fgrid">
                        <p id="videojuego-mensaje" role="status" style="grid-column: 1 / -1"></p>
                        <div class="field">
                            <dt class="eyebrow">ID del juego</dt>
                            <dd class="input" th:text="${videojuego.id}">1</dd>
                        </div>
                        <div class="field">
                            <label>NOMBRE DEL JUEGO</label>
                            <input type="text" th:field="*{nombre}" class="input" placeholder="Ej. CyberStrike 2088"
                                required>
                        </div>
                        <div class="field">
                            <label for="plataforma">PLATAFORMA</label>
                            <select id="plataforma" name="plataforma" class="input" required>
                                <option value="" disabled th:selected="${videojuego.plataforma?.id == null}">
                                    Selecciona una Plataforma
                                </option>

                                <option th:each="plataforma : ${plataformas}" th:value="${plataforma.id}"
                                    th:text="${plataforma.nombre}"
                                    th:selected="${plataforma.id == videojuego.plataforma?.id}"
                                    th:attr="data-nombre=${plataforma.nombre}">
                                </option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="region">REGION</label>
                            <select id="region" name="region" class="input" required>
                                <option value="" disabled th:selected="${videojuego.region?.id == null}">
                                    Selecciona una Region
                                </option>

                                <option th:each="region : ${regiones}" th:value="${region.id}"
                                    th:text="${region.nombre}" th:selected="${region.id == videojuego.region?.id}"
                                    th:attr="data-nombre=${region.nombre}">
                                </option>
                            </select>
                        </div>
                        <div class="field">
                            <label>PRECIO (MXN)</label>
                            <input type="number" th:field="*{precio}" step="0.01" class="input" placeholder="59.99"
                                required>
                        </div>
                        <div class="field">
                            <label>STOCK</label>
                            <input type="number" th:field="*{stock}" class="input" placeholder="50" required>
                        </div>
                        <div class="field">
                            <label for="categoria">CATEGORIA</label>
                            <select id="categoria" name="categoria" class="input" required>
                                <option value="" disabled th:selected="${videojuego.categoria?.id == null}">
                                    Selecciona una categoría
                                </option>

                                <option th:each="categoria : ${categorias}" th:value="${categoria.id}"
                                    th:text="${categoria.nombre}"
                                    th:selected="${categoria.id == videojuego.categoria?.id}"
                                    th:attr="data-nombre=${categoria.nombre},data-descripcion=${categoria.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="activo">ESTADO DEL VIDEOJUEGO</label>
                            <select id="activo" th:field="*{activo}" class="input" required>
                                <option value="" disabled>Selecciona un estado</option>
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>

                        <div class="field" style="grid-column: 1 / -1">
                            <label>DESCRIPCION</label>
                            <textarea th:field="*{descripcion}" class="input"
                                placeholder="Escribe los detalles, requisitos del sistema e incentivos de reserva..."></textarea>
                        </div>
                        <div class="form-actions" style="grid-column: 1 / -1">
                            <button type="submit" class="btn-primary">GUARDAR CAMBIOS</button>
                            <a th:href="@{/catalogo}" class="btn-ghost">CANCELAR</a>
                        </div>
                    </form>
                </div>
            </main>

        </div>
    </div>
    <script>
        const formulario = document.getElementById('videojuego-form');
        const mensaje = document.getElementById('videojuego-mensaje');
        const boton = formulario.querySelector('button[type="submit"]');
        const originales = new FormData(formulario);

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensaje.textContent = '';

            const campos = new FormData(formulario);
            const valores = {
                nombre: campos.get('nombre'),
                descripcion: campos.get('descripcion'),
                precio: Number(campos.get('precio')),
                stock: Number(campos.get('stock')),
                plataforma: { id: Number(campos.get('plataforma')) },
                region: { id: Number(campos.get('region')) },
                categoria: { id: Number(campos.get('categoria')) },
                activo: campos.get('activo') === 'true'
            };

            const cambios = Object.fromEntries(
                Object.entries(valores).filter(([campo]) =>
                    campos.get(campo) !== originales.get(campo)
                )
            );

            if (Object.keys(cambios).length === 0) {
                mensaje.textContent = 'No hay cambios para guardar.';
                return;
            }

            boton.disabled = true;

            try {
                const cabeceraCsrf = document.querySelector('meta[name="_csrf_header"]').content;
                const tokenCsrf = document.querySelector('meta[name="_csrf"]').content;

                const respuesta = await fetch(formulario.action, {
                    method: 'PATCH',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        [cabeceraCsrf]: tokenCsrf
                    },
                    body: JSON.stringify(cambios)
                });

                if (respuesta.redirected || respuesta.status === 401) {
                    mensaje.textContent = 'Vuelve a iniciar sesión para guardar los cambios.';
                    return;
                }

                if (!respuesta.ok) {
                    const error = await respuesta.json().catch(() => null);
                    mensaje.textContent = error?.message
                        || `No se pudieron guardar los cambios (${respuesta.status}).`;
                    return;
                }

                window.location.assign(formulario.dataset.catalogoUrl);
            } catch (error) {
                console.error(error);
                mensaje.textContent = 'Ocurrió un error al enviar los cambios.';
            } finally {
                boton.disabled = false;
            }
        });
    </script>
</body>

</html>
