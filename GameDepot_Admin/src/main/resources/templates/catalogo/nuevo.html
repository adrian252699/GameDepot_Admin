<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Agregar Producto - GameDepot Admin</title>
      <meta name="_csrf" th:content="${_csrf.token}">
      <meta name="_csrf_header" th:content="${_csrf.headerName}">
      <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
      <div class="page">

            <div th:replace="~{fragments :: header('productos')}"></div>
            <div class="main-layout">

                  <div th:replace="~{fragments :: sidebar('productos')}"></div>
                  <main class="content">
                        <div class="sec-head">
                              <h2>Agregar Nuevo Producto</h2>
                              <a th:href="@{/catalogo}" class="btn-ghost">Volver al Catalogo</a>
                        </div>
                        <div class="panel">
                              <form id="videojuego-form" th:action="@{/api/videojuego}" th:object="${videojuego}"
                                    th:attr="data-catalogo-url=@{/catalogo}" method="post" class="fgrid">
                                    <p id="videojuego-error" role="alert" style="grid-column: 1 / -1" hidden></p>

                                    <div class="field">
                                          <label>NOMBRE DEL JUEGO</label>
                                          <input type="text" th:field="*{nombre}" class="input"
                                                placeholder="Ej. CyberStrike 2088" required>
                                    </div>

                                    <div class="field">
                                          <label for="plataforma">PLATAFORMA</label>
                                          <select id="plataforma" name="plataforma" class="input" required>
                                                <option value="" disabled selected>Selecciona una plataforma</option>
                                                <option th:each="plataforma : ${plataformas}"
                                                      th:value="${plataforma.id}" th:text="${plataforma.nombre}"
                                                      th:attr="data-nombre=${plataforma.nombre}">
                                                </option>
                                          </select>
                                    </div>

                                    <div class="field">
                                          <label for="region">REGION</label>
                                          <select id="region" name="region" class="input" required>
                                                <option value="" disabled selected>Selecciona una region</option>
                                                <option th:each="region : ${regiones}" th:value="${region.id}"
                                                      th:text="${region.nombre}" th:attr="data-nombre=${region.nombre}">
                                                </option>
                                          </select>
                                    </div>

                                    <div class="field">
                                          <label>PRECIO (MXN)</label>
                                          <input type="number" th:field="*{precio}" step="0.01" class="input"
                                                placeholder="59.99" required>
                                    </div>
                                    <div class="field">
                                          <label>STOCK</label>
                                          <input type="number" th:field="*{stock}" class="input" placeholder="50"
                                                required>
                                    </div>
                                    <div class="field">
                                          <label for="categoria">CATEGORIA</label>
                                          <select id="categoria" name="categoria" class="input" required>
                                                <option value="" disabled selected>Selecciona una categoría</option>
                                                <option th:each="categoria : ${categorias}" th:value="${categoria.id}"
                                                      th:text="${categoria.nombre}"
                                                      th:attr="data-nombre=${categoria.nombre},data-descripcion=${categoria.descripcion}">
                                                </option>
                                          </select>
                                    </div>
                                    <div class="field" style="grid-column: 1 / -1">
                                          <label>DESCRIPCION</label>
                                          <textarea th:field="*{descripcion}" class="input"
                                                placeholder="Escribe los detalles, requisitos del sistema e incentivos de reserva..."></textarea>
                                    </div>
                                    <div class="form-actions" style="grid-column: 1 / -1">
                                          <button type="submit" class="btn-primary">Guardar Producto</button>
                                          <a th:href="@{/catalogo}" class="btn-ghost">Cancelar</a>
                                    </div>
                              </form>
                        </div>
                  </main>
            </div>
      </div>
      <script>
            const formulario = document.querySelector('#videojuego-form');
            const selectorCategoria = document.querySelector('#categoria');
            const selectorPlataforma = document.querySelector('#plataforma');
            const selectorRegion = document.querySelector('#region');
            const avisoError = document.querySelector('#videojuego-error');
            const botonGuardar = formulario.querySelector('button[type="submit"]');

            formulario.addEventListener('submit', async (evento) => {
                  evento.preventDefault();
                  avisoError.hidden = true;
                  const categoriaSeleccionada = selectorCategoria.selectedOptions[0];
                  const plataformaSeleccionada = selectorPlataforma.selectedOptions[0];
                  const regionSeleccionada = selectorRegion.selectedOptions[0];

                  if (!categoriaSeleccionada?.value) {
                        avisoError.textContent = 'Selecciona una categoría.';
                        avisoError.hidden = false;
                        return;
                  }

                  if (!plataformaSeleccionada?.value) {
                        avisoError.textContent = 'Selecciona una plataforma.';
                        avisoError.hidden = false;
                        return;
                  }
                  if (!regionSeleccionada?.value) {
                        avisoError.textContent = 'Selecciona una region.';
                        avisoError.hidden = false;
                        return;
                  }

                  botonGuardar.disabled = true;
                  const campos = new FormData(formulario);
                  const videojuego = {
                        nombre: campos.get('nombre'),
                        plataforma: {
                              id: Number(plataformaSeleccionada.value),
                              nombre: plataformaSeleccionada.dataset.nombre
                        },
                        region: {
                              id: Number(regionSeleccionada.value),
                              nombre: regionSeleccionada.dataset.nombre
                        },
                        precio: Number(campos.get('precio')),
                        stock: Number(campos.get('stock')),
                        categoria: {
                              id: Number(categoriaSeleccionada.value),
                              nombre: categoriaSeleccionada.dataset.nombre,
                              descripcion: categoriaSeleccionada.dataset.descripcion ?? null
                        },
                        descripcion: campos.get('descripcion')
                  };

                  try {
                        const cabeceraCsrf = document.querySelector('meta[name="_csrf_header"]').content;
                        const tokenCsrf = document.querySelector('meta[name="_csrf"]').content;
                        const respuesta = await fetch(formulario.action, {
                              method: 'POST',
                              credentials: 'same-origin',
                              headers: {
                                    'Content-Type': 'application/json',
                                    'Accept': 'application/json',
                                    [cabeceraCsrf]: tokenCsrf
                              },
                              body: JSON.stringify(videojuego)
                        });

                        if (respuesta.redirected || respuesta.status === 401) {
                              avisoError.textContent = 'La sesión expiró. Vuelve a iniciar sesión.';
                              avisoError.hidden = false;
                              return;
                        }

                        if (!respuesta.ok) {
                              const error = await respuesta.json().catch(() => null);
                              const detalles = Array.isArray(error?.details) ? error.details.join(' ') : '';
                              avisoError.textContent = detalles || error?.message
                                    || `No se pudo guardar el videojuego (${respuesta.status}).`;
                              avisoError.hidden = false;
                              return;
                        }

                        window.location.assign(formulario.dataset.catalogoUrl);
                  } catch {
                        avisoError.textContent = 'No se pudo completar la solicitud.';
                        avisoError.hidden = false;
                  } finally {
                        botonGuardar.disabled = false;
                  }
            });
      </script>
</body>

</html>
